<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmados · Encuentro NT+GF</title>
<style>
  body{font-family:system-ui,sans-serif;background:#101a14;color:#f3ecdd;margin:0;padding:24px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  .tot{color:#c8a45c;margin:10px 0 16px;font-size:15px}
  .gate{max-width:420px;margin:60px auto;text-align:center}
  .gate input{width:100%;box-sizing:border-box;background:#16221b;border:1px solid #2a3c30;border-radius:10px;color:#f3ecdd;font-size:16px;padding:12px 14px;outline:none;margin-bottom:12px}
  .gate input:focus{border-color:#c8a45c}
  button{background:#c8a45c;color:#17130a;border:0;border-radius:10px;font-size:14px;font-weight:600;padding:12px 22px;cursor:pointer}
  button:hover{background:#e0c384}
  .err{color:#e8b0a8;margin-top:12px;display:none}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#16221b;border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #24352b;white-space:nowrap}
  th{background:#1c2b22;color:#c8a45c;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  tr.no td{opacity:.45}
  .wrap{overflow-x:auto}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .bar button{padding:8px 14px;font-size:12.5px}
  #panel{display:none}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <h1>Lista de confirmados</h1>
    <p style="color:#9fae9f;font-size:14px">Encuentro Privado NT + GF · 1 sep 2026</p>
    <input type="password" id="clave" placeholder="Clave de acceso" autocomplete="current-password">
    <button id="entrar">Ver lista</button>
    <div class="err" id="gerr"></div>
  </div>

  <div id="panel">
    <div class="bar">
      <div>
        <h1>Encuentro Privado NT + GF · 1 sep 2026</h1>
        <div class="tot" id="tot"></div>
      </div>
      <div>
        <button id="refrescar">Refrescar</button>
        <button id="csv">Descargar CSV</button>
        <button id="salir" style="background:#2a3c30;color:#f3ecdd">Salir</button>
      </div>
    </div>
    <div class="wrap"><table id="tabla"></table></div>
  </div>

<script>
(function(){
  var API = 'https://nlbydvntjbevbhghtdcx.supabase.co/functions/v1/evento/lista';
  var gate = document.getElementById('gate'), panel = document.getElementById('panel');
  var gerr = document.getElementById('gerr');
  var datos = [];

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function fecha(iso){
    if(!iso) return '';
    try { return new Date(iso).toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'}); }
    catch(e){ return iso; }
  }

  function cargar(clave){
    gerr.style.display = 'none';
    fetch(API + '?formato=json&clave=' + encodeURIComponent(clave))
    .then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(res){
      if(res.s !== 200 || !res.j.ok){
        gerr.textContent = res.s === 401 ? 'Clave incorrecta.' : (res.j.error || 'Error al cargar.');
        gerr.style.display = 'block';
        sessionStorage.removeItem('evclave');
        gate.style.display = 'block'; panel.style.display = 'none';
        return;
      }
      sessionStorage.setItem('evclave', clave);
      datos = res.j.asistentes || [];
      var si = datos.filter(function(r){ return r.asistira; }).length;
      document.getElementById('tot').innerHTML = '<b>' + si + '</b> confirmados · <b>' +
        (datos.length - si) + '</b> no asistirán · <b>' + datos.length + '</b> respuestas';
      var h = '<tr><th>Nombre</th><th>Empresa</th><th>Puesto</th><th>Email</th><th>Celular</th><th>Asiste</th><th>Registrado</th><th>Check-in</th></tr>';
      if(!datos.length) h += '<tr><td colspan="8">Sin registros todavía</td></tr>';
      datos.forEach(function(r){
        h += '<tr class="' + (r.asistira ? '' : 'no') + '"><td>' + esc(r.nombre) + '</td><td>' + esc(r.empresa) +
          '</td><td>' + esc(r.puesto) + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.celular) +
          '</td><td>' + (r.asistira ? '✅ Sí' : '❌ No') + '</td><td>' + fecha(r.creado_en) +
          '</td><td>' + (r.checkin_en ? '🎫 ' + fecha(r.checkin_en) : '') + '</td></tr>';
      });
      document.getElementById('tabla').innerHTML = h;
      gate.style.display = 'none'; panel.style.display = 'block';
    })
    .catch(function(){
      gerr.textContent = 'Error de conexión.'; gerr.style.display = 'block';
    });
  }

  document.getElementById('entrar').addEventListener('click', function(){
    cargar(document.getElementById('clave').value.trim());
  });
  document.getElementById('clave').addEventListener('keydown', function(e){
    if(e.key === 'Enter') cargar(this.value.trim());
  });
  document.getElementById('refrescar').addEventListener('click', function(){
    cargar(sessionStorage.getItem('evclave') || '');
  });
  document.getElementById('salir').addEventListener('click', function(){
    sessionStorage.removeItem('evclave'); location.reload();
  });
  document.getElementById('csv').addEventListener('click', function(){
    var enc = function(v){ v = String(v == null ? '' : v); return '"' + v.replace(/"/g,'""') + '"'; };
    var csv = '﻿Nombre,Empresa,Puesto,Email,Celular,Asiste,Registrado,Check-in\r\n';
    datos.forEach(function(r){
      csv += [enc(r.nombre),enc(r.empresa),enc(r.puesto),enc(r.email),enc(r.celular),
        r.asistira?'Si':'No',enc(fecha(r.creado_en)),enc(r.checkin_en?fecha(r.checkin_en):'')].join(',') + '\r\n';
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = 'confirmados_evento_1sep2026.csv';
    a.click();
  });

  var guardada = sessionStorage.getItem('evclave');
  if(guardada) cargar(guardada);
})();
</script>
</body>
</html>
