<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmados · Encuentro NT+GF</title>
<style>
  body{font-family:system-ui,sans-serif;background:#101a14;color:#f3ecdd;margin:0;padding:24px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  .tot{color:#c8a45c;margin:10px 0 16px;font-size:15px}
  .gate{max-width:420px;margin:60px auto;text-align:center}
  .gate input{width:100%;box-sizing:border-box;background:#16221b;border:1px solid #2a3c30;border-radius:10px;color:#f3ecdd;font-size:16px;padding:12px 14px;outline:none;margin-bottom:12px}
  .gate input:focus{border-color:#c8a45c}
  button{background:#c8a45c;color:#17130a;border:0;border-radius:10px;font-size:14px;font-weight:600;padding:12px 22px;cursor:pointer}
  button:hover{background:#e0c384}
  .err{color:#e8b0a8;margin-top:12px;display:none}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#16221b;border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #24352b;white-space:nowrap}
  th{background:#1c2b22;color:#c8a45c;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  tr.no td{opacity:.45}
  .wrap{overflow-x:auto}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .bar button{padding:8px 14px;font-size:12.5px}
  #panel{display:none}
  .dup{display:inline-block;background:rgba(200,164,92,.16);border:1px solid rgba(200,164,92,.5);
    color:#e0c384;border-radius:6px;font-size:10.5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .manual{display:inline-block;background:rgba(120,160,220,.14);border:1px solid rgba(120,160,220,.45);
    color:#a9c4e8;border-radius:6px;font-size:10.5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  #alta{display:none;background:#16221b;border:1px solid #2a3c30;border-radius:12px;
    padding:16px;margin:14px 0}
  #alta h2{font-size:15px;margin:0 0 12px;color:#c8a45c}
  #alta .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  #alta input{width:100%;box-sizing:border-box;background:#101a14;border:1px solid #2a3c30;
    border-radius:8px;color:#f3ecdd;font-size:14px;padding:10px 12px;outline:none}
  #alta input:focus{border-color:#c8a45c}
  #alta label{display:block;font-size:11px;color:#9fae9f;text-transform:uppercase;
    letter-spacing:.08em;margin:0 0 4px}
  #alta .acciones{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  #alta .sel{background:#101a14;border:1px solid #2a3c30;border-radius:8px;color:#f3ecdd;
    font-size:14px;padding:10px 12px}
  #aerr{color:#e8b0a8;display:none;font-size:13.5px}
  #aok{color:#9ed6a8;display:none;font-size:13.5px}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <h1>Lista de confirmados</h1>
    <p style="color:#9fae9f;font-size:14px">Encuentro Privado NT + GF · 1 sep 2026</p>
    <input type="password" id="clave" placeholder="Clave de acceso" autocomplete="current-password">
    <button id="entrar">Ver lista</button>
    <div class="err" id="gerr"></div>
  </div>

  <div id="panel">
    <div class="bar">
      <div>
        <h1>Encuentro Privado NT + GF · 1 sep 2026</h1>
        <div class="tot" id="tot"></div>
      </div>
      <div>
        <button id="agregar">＋ Agregar registro</button>
        <button id="refrescar">Refrescar</button>
        <button id="csv">Descargar CSV</button>
        <button id="salir" style="background:#2a3c30;color:#f3ecdd">Salir</button>
      </div>
    </div>

    <div id="alta">
      <h2>Registro manual</h2>
      <div class="g">
        <div><label for="aNombre">Nombre completo *</label><input id="aNombre" autocomplete="off"></div>
        <div><label for="aEmpresa">Empresa *</label><input id="aEmpresa" autocomplete="off"></div>
        <div><label for="aPuesto">Puesto</label><input id="aPuesto" autocomplete="off"></div>
        <div><label for="aEmail">Correo *</label><input id="aEmail" type="email" autocomplete="off"></div>
        <div><label for="aCelular">Celular / WhatsApp</label><input id="aCelular" autocomplete="off"></div>
        <div><label for="aNotas">Notas (quién lo registró, contexto)</label><input id="aNotas" autocomplete="off"></div>
      </div>
      <div class="acciones">
        <select class="sel" id="aAsiste">
          <option value="si" selected>✅ Sí asistirá</option>
          <option value="no">❌ No asistirá</option>
        </select>
        <button id="aGuardar">Guardar registro</button>
        <button id="aCerrar" style="background:#2a3c30;color:#f3ecdd">Cerrar</button>
        <span id="aerr"></span><span id="aok"></span>
      </div>
      <p style="color:#9fae9f;font-size:12.5px;margin:12px 0 0">Se puede repetir un correo: cada
        registro es una fila nueva y nadie se borra. Los repetidos salen marcados con
        <span class="dup">correo repetido</span> en la lista para depurarlos después.</p>
    </div>

    <div class="wrap"><table id="tabla"></table></div>
  </div>

<script>
(function(){
  var API = 'https://nlbydvntjbevbhghtdcx.supabase.co/functions/v1/evento/lista';
  var gate = document.getElementById('gate'), panel = document.getElementById('panel');
  var gerr = document.getElementById('gerr');
  var datos = [];

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function fecha(iso){
    if(!iso) return '';
    try { return new Date(iso).toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'}); }
    catch(e){ return iso; }
  }

  function cargar(clave){
    gerr.style.display = 'none';
    fetch(API + '?formato=json&clave=' + encodeURIComponent(clave))
    .then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(res){
      if(res.s !== 200 || !res.j.ok){
        gerr.textContent = res.s === 401 ? 'Clave incorrecta.' : (res.j.error || 'Error al cargar.');
        gerr.style.display = 'block';
        sessionStorage.removeItem('evclave');
        gate.style.display = 'block'; panel.style.display = 'none';
        return;
      }
      sessionStorage.setItem('evclave', clave);
      datos = res.j.asistentes || [];
      var si = datos.filter(function(r){ return r.asistira; }).length;
      document.getElementById('tot').innerHTML = '<b>' + si + '</b> confirmados · <b>' +
        (datos.length - si) + '</b> no asistirán · <b>' + datos.length + '</b> respuestas';
      var porCorreo = {};
      datos.forEach(function(r){ var e = (r.email||'').toLowerCase();
        porCorreo[e] = (porCorreo[e] || 0) + 1; });
      var h = '<tr><th>Nombre</th><th>Empresa</th><th>Puesto</th><th>Email</th><th>Celular</th><th>Asiste</th><th>Registrado</th><th>Check-in</th></tr>';
      if(!datos.length) h += '<tr><td colspan="8">Sin registros todavía</td></tr>';
      datos.forEach(function(r){
        var dup = porCorreo[(r.email||'').toLowerCase()] > 1 ? ' <span class="dup">correo repetido</span>' : '';
        var man = r.fuente === 'manual' ? ' <span class="manual">manual</span>' : '';
        h += '<tr class="' + (r.asistira ? '' : 'no') + '"><td>' + esc(r.nombre) + man + '</td><td>' + esc(r.empresa) +
          '</td><td>' + esc(r.puesto) + '</td><td>' + esc(r.email) + dup + '</td><td>' + esc(r.celular) +
          '</td><td>' + (r.asistira ? '✅ Sí' : '❌ No') + '</td><td>' + fecha(r.creado_en) +
          '</td><td>' + (r.checkin_en ? '🎫 ' + fecha(r.checkin_en) : '') + '</td></tr>';
      });
      document.getElementById('tabla').innerHTML = h;
      gate.style.display = 'none'; panel.style.display = 'block';
    })
    .catch(function(){
      gerr.textContent = 'Error de conexión.'; gerr.style.display = 'block';
    });
  }

  document.getElementById('entrar').addEventListener('click', function(){
    cargar(document.getElementById('clave').value.trim());
  });
  document.getElementById('clave').addEventListener('keydown', function(e){
    if(e.key === 'Enter') cargar(this.value.trim());
  });
  document.getElementById('refrescar').addEventListener('click', function(){
    cargar(sessionStorage.getItem('evclave') || '');
  });
  document.getElementById('salir').addEventListener('click', function(){
    sessionStorage.removeItem('evclave'); location.reload();
  });
  document.getElementById('csv').addEventListener('click', function(){
    var enc = function(v){ v = String(v == null ? '' : v); return '"' + v.replace(/"/g,'""') + '"'; };
    var csv = '﻿Nombre,Empresa,Puesto,Email,Celular,Asiste,Registrado,Check-in\r\n';
    datos.forEach(function(r){
      csv += [enc(r.nombre),enc(r.empresa),enc(r.puesto),enc(r.email),enc(r.celular),
        r.asistira?'Si':'No',enc(fecha(r.creado_en)),enc(r.checkin_en?fecha(r.checkin_en):'')].join(',') + '\r\n';
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = 'confirmados_evento_1sep2026.csv';
    a.click();
  });

  // -------- registro manual --------
  var ALTA = 'https://nlbydvntjbevbhghtdcx.supabase.co/functions/v1/evento/alta';
  var alta = document.getElementById('alta');
  var aerr = document.getElementById('aerr'), aok = document.getElementById('aok');
  document.getElementById('agregar').addEventListener('click', function(){
    alta.style.display = alta.style.display === 'block' ? 'none' : 'block';
    aerr.style.display = 'none'; aok.style.display = 'none';
    if(alta.style.display === 'block') document.getElementById('aNombre').focus();
  });
  document.getElementById('aCerrar').addEventListener('click', function(){
    alta.style.display = 'none';
  });
  document.getElementById('aGuardar').addEventListener('click', function(){
    aerr.style.display = 'none'; aok.style.display = 'none';
    var btn = this;
    var datos = {
      clave:   sessionStorage.getItem('evclave') || '',
      nombre:  document.getElementById('aNombre').value.trim(),
      empresa: document.getElementById('aEmpresa').value.trim(),
      puesto:  document.getElementById('aPuesto').value.trim(),
      email:   document.getElementById('aEmail').value.trim(),
      celular: document.getElementById('aCelular').value.trim(),
      notas:   document.getElementById('aNotas').value.trim(),
      asistira: document.getElementById('aAsiste').value === 'si'
    };
    if(!datos.nombre || !datos.empresa || !datos.email){
      aerr.textContent = 'Faltan nombre, empresa o correo.'; aerr.style.display = 'inline'; return;
    }
    btn.disabled = true; btn.textContent = 'Guardando…';
    fetch(ALTA, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos) })
    .then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(res){
      btn.disabled = false; btn.textContent = 'Guardar registro';
      if(res.s === 200 && res.j.ok){
        aok.textContent = '✓ Guardado: ' + (res.j.fila ? res.j.fila.nombre : datos.nombre);
        aok.style.display = 'inline';
        ['aNombre','aEmpresa','aPuesto','aEmail','aCelular','aNotas'].forEach(function(id){
          document.getElementById(id).value = '';
        });
        document.getElementById('aNombre').focus();
        cargar(sessionStorage.getItem('evclave') || '');
      } else {
        aerr.textContent = res.j.error || 'No se pudo guardar.';
        aerr.style.display = 'inline';
      }
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Guardar registro';
      aerr.textContent = 'Error de conexión.'; aerr.style.display = 'inline';
    });
  });

  var guardada = sessionStorage.getItem('evclave');
  if(guardada) cargar(guardada);
})();
</script>
</body>
</html>
